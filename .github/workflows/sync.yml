name: Sync public skills

on:
  schedule:
    - cron: '37 7 * * *'
  workflow_dispatch:
    inputs:
      artifact_workers:
        description: Concurrent artifact downloads (1–4)
        type: choice
        required: true
        default: '2'
        options: ['1', '2', '3', '4']
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', '.github/workflows/sync.yml']
  pull_request:
    paths: ['scripts/**', 'tests/**', '.github/workflows/sync.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s tests -v

  sync:
    needs: test
    if: github.repository == 'Vectle/skills' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: public-skills-publisher
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Find the last successful main check
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! last_success=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/sync.yml/runs?status=success&per_page=100" --jq '[.workflow_runs[] | select(.head_branch == "main" and .event != "pull_request")] | first | .updated_at // empty'); then
            last_success=''
            echo 'Previous check lookup failed; freshness will be reported as unknown.'
          fi
          echo "last_success=$last_success" >> "$GITHUB_OUTPUT"
      - name: Reconcile, validate admission and publish one snapshot
        env:
          PREVIOUS_SUCCESS: ${{ steps.freshness.outputs.last_success }}
          ARTIFACT_WORKERS: ${{ github.event.inputs.artifact_workers || '2' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/sync.py --publish --workers "$ARTIFACT_WORKERS" --last-success "$PREVIOUS_SUCCESS" --report "$RUNNER_TEMP/public-skills-attempt.json"
